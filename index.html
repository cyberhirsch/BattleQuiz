<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BattleQuiz — Türkçe / English turn-based quiz duel</title>
<meta name="description" content="A turn-based bilingual (Turkish / English) multiple-choice quiz for two to four players, with age-based difficulty, topic stealing, and a double-or-nothing bomb round.">
<meta name="theme-color" content="#0d1024">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="app">

  <!-- ============ SETUP ============ -->
  <section class="screen is-active" id="screen-setup">
    <header class="brand">
      <h1 class="brand__title">Battle<span>Quiz</span></h1>
      <p class="brand__tagline" data-i18n="tagline"></p>
    </header>

    <div class="uilang">
      <button class="uilang__btn" data-uilang="en" type="button">English</button>
      <button class="uilang__btn" data-uilang="tr" type="button">Türkçe</button>
    </div>

    <div class="card resume" id="resume-card" hidden>
      <p class="resume__label" id="resume-label"></p>
      <p class="resume__where" id="resume-where"></p>
      <button class="btn btn--primary btn--big" id="resume-go" type="button"></button>
      <button class="btn btn--ghost" id="resume-drop" type="button"></button>
    </div>

    <form class="card setup" id="setup-form" autocomplete="off" novalidate>
      <h2 class="card__title" data-i18n="setup"></h2>

      <div class="setup__players" id="players"></div>
      <button class="btn btn--ghost setup__add" id="add-player" type="button"></button>

      <div class="setup__opts">
        <label><span data-i18n="rounds"></span>
          <select id="opt-rounds">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </label>
        <label><span data-i18n="bombChance"></span>
          <select id="opt-bomb">
            <option value="low" data-i18n="bombLow"></option>
            <option value="normal" selected data-i18n="bombNormal"></option>
            <option value="high" data-i18n="bombHigh"></option>
          </select>
        </label>
        <label class="toggle">
          <span data-i18n="sound"></span>
          <button type="button" id="opt-sound" class="toggle__btn" aria-pressed="true"></button>
        </label>
      </div>

      <p class="setup__error" id="setup-error" role="alert" hidden></p>
      <button class="btn btn--primary btn--big" type="submit" data-i18n="start"></button>

      <details class="howto">
        <summary data-i18n="howto"></summary>
        <p data-i18n="howtoText"></p>
      </details>
    </form>
  </section>

  <!-- ============ HAND-OVER ============ -->
  <section class="screen" id="screen-handover">
    <div class="card handover">
      <p class="handover__pass" id="ho-pass"></p>
      <h2 class="handover__name" id="ho-name"></h2>
      <p class="handover__hint" id="ho-hint"></p>
      <div class="handover__topic">
        <span class="handover__topic-name" id="ho-topic"></span>
        <span class="handover__topic-by" id="ho-topic-by"></span>
      </div>
      <p class="handover__round" id="ho-round"></p>
      <p class="handover__steals" id="ho-steals"></p>
      <button class="btn btn--primary btn--big" id="ho-go" type="button"></button>
      <button class="btn btn--steal" id="ho-steal" type="button" hidden></button>
    </div>
  </section>

  <!-- ============ BOMB CHOICE ============ -->
  <section class="screen" id="screen-bomb">
    <div class="card bomb">
      <div class="bomb__icon" aria-hidden="true">💣</div>
      <h2 class="bomb__title" id="bomb-title"></h2>
      <p class="bomb__text" id="bomb-text"></p>
      <p class="bomb__stake" id="bomb-stake"></p>
      <p class="bomb__cost" id="bomb-cost"></p>
      <p class="bomb__nothing" id="bomb-nothing" hidden></p>
      <div class="bomb__actions">
        <button class="btn btn--danger btn--big" id="bomb-risk" type="button"></button>
        <button class="btn btn--ghost" id="bomb-safe" type="button"></button>
      </div>
    </div>
  </section>

  <!-- ============ STEAL ============ -->
  <section class="screen" id="screen-steal">
    <div class="card heist">
      <div class="heist__icon" aria-hidden="true">💰</div>
      <h2 class="heist__title" id="steal-title"></h2>
      <p class="heist__text" id="steal-text"></p>
      <p class="heist__pick" id="steal-pick" tabindex="-1"></p>
      <div class="heist__targets" id="steal-targets"></div>
      <button class="btn btn--ghost" id="steal-cancel" type="button"></button>
    </div>
  </section>

  <!-- ============ QUESTION ============ -->
  <section class="screen" id="screen-quiz">
    <div class="hud">
      <div class="hud__players" id="hud-players"></div>
      <div class="hud__mid">
        <div class="hud__round" id="hud-round"></div>
        <div class="timer" id="timer" aria-hidden="true">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle class="timer__track" cx="20" cy="20" r="17"></circle>
            <circle class="timer__bar" id="timer-bar" cx="20" cy="20" r="17"></circle>
          </svg>
          <span class="timer__num" id="timer-num"></span>
        </div>
      </div>
    </div>

    <div class="qwrap" id="qwrap" aria-live="polite">
      <div class="qmeta">
        <span class="chip" id="q-topic"></span>
        <span class="chip" id="q-diff"></span>
        <span class="chip chip--tf" id="q-tf" hidden></span>
        <span class="chip chip--bomb" id="q-bomb" hidden></span>
        <span class="chip chip--steal" id="q-steal" hidden></span>
      </div>
      <h2 class="question" id="q-text" tabindex="-1"></h2>
      <div class="answers" id="answers"></div>
    </div>

    <div class="feedback" id="feedback" role="status" aria-live="polite" hidden>
      <div class="feedback__verdict" id="fb-verdict"></div>
      <div class="feedback__detail" id="fb-detail"></div>
      <div class="feedback__why" id="fb-why" hidden></div>
      <div class="feedback__delta" id="fb-delta"></div>
      <button class="btn btn--primary btn--big" id="fb-next" type="button"></button>
    </div>

    <button class="quit" id="quit-btn" type="button"></button>
  </section>

  <!-- ============ TOPIC PICKER ============ -->
  <section class="screen" id="screen-topic">
    <div class="card topicpick">
      <div class="topicpick__icon" aria-hidden="true">🎯</div>
      <h2 class="topicpick__title" id="tp-title" tabindex="-1"></h2>
      <div class="topicpick__grid" id="tp-grid"></div>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="screen" id="screen-result">
    <div class="card result">
      <h2 class="card__title" id="res-title"></h2>
      <div class="result__crown" id="res-crown" aria-hidden="true">🏆</div>
      <h3 class="result__winner" id="res-winner" tabindex="-1"></h3>
      <div class="result__grid" id="res-grid"></div>
      <div class="result__actions">
        <button class="btn btn--primary btn--big" id="res-again" type="button"></button>
        <button class="btn btn--ghost" id="res-setup" type="button"></button>
      </div>
    </div>
  </section>

</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/questions/science.js"></script>
<script src="assets/js/questions/nature.js"></script>
<script src="assets/js/questions/geography.js"></script>
<script src="assets/js/questions/history.js"></script>
<script src="assets/js/questions/sport.js"></script>
<script src="assets/js/questions/music.js"></script>
<script src="assets/js/questions/screen.js"></script>
<script src="assets/js/questions/books.js"></script>
<script src="assets/js/questions/tech.js"></script>
<script src="assets/js/questions/life.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/game.js"></script>
</body>
</html>
